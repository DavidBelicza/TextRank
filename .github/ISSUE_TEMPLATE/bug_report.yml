name: Bug report
description: Report wrong or unexpected behaviour of the library.
labels:
  - bug

body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What did you expect, and what did you get instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Code to reproduce
      description: >
        A short Go program or test that shows the problem. Include the input
        text when the result depends on it.
      render: go
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: TextRank version
      placeholder: v2.1.1
    validations:
      required: true

  - type: input
    id: go-version
    attributes:
      label: Go version
      description: Output of go version.
      placeholder: go1.26.5 linux/amd64
    validations:
      required: true
